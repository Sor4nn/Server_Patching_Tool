services:
  db:
    image: postgres:18
    container_name: gpta-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-gpta}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-gpta}
      - POSTGRES_DB=${POSTGRES_DB:-gpta}
    volumes:
      - gpta-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gpta} -d ${POSTGRES_DB:-gpta}"]
      interval: 5s
      timeout: 5s
      retries: 10

  gpta:
    build: .
    container_name: gpta
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "61008:61008"
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-gpta}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-gpta}
      - DATABASE_NAME=${POSTGRES_DB:-gpta}
      - DATA_DIR=/data
      - USER_FILES_PATH=/data/user_files
      - AWX_PROTOCOL=${AWX_PROTOCOL:-https}
      - AWX_HOST=${AWX_HOST:-YourHost}
      - AWX_PORT=${AWX_PORT:-8443}
      - AWX_AUTH_MODE=${AWX_AUTH_MODE:-basic}
      - AWX_USERNAME=${AWX_USERNAME:-<username>}
      - AWX_PASSWORD=${AWX_PASSWORD:-<password>}
      - AWX_TOKEN=${AWX_TOKEN:-}
      - AWX_VAULT_ID=${AWX_VAULT_ID:-3}
      - AWX_OMD_SSH_KEY_CRED_ID=${AWX_OMD_SSH_KEY_CRED_ID:-4}
      - AWX_ITOPS_SSH_KEY_CRED_ID=${AWX_ITOPS_SSH_KEY_CRED_ID:-5}
      - AWX_MASTER_INVENTORY=${AWX_MASTER_INVENTORY:-master_inventory}
      - AWX_PROJECT=${AWX_PROJECT:-zeroops}
      - ENDPOINTS_BASE_URL=${ENDPOINTS_BASE_URL:-http://localhost:61008}
      - SEED_ADMIN_USER=${SEED_ADMIN_USER:-test}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-Bogdan123!}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - gpta-data:/data

volumes:
  gpta-data:
  gpta-pgdata:
