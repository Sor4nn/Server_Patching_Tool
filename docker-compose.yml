services:
  gpta:
    build: .
    container_name: gpta
    restart: unless-stopped
    ports:
      - "61008:61008"
    environment:
      - DB_URL=/data/gpta.db
      - DATA_DIR=/data
      - USER_FILES_PATH=/data/user_files
      - AWX_PROTOCOL=${AWX_PROTOCOL:-https}
      - AWX_HOST=${AWX_HOST:-YourHost}
      - AWX_PORT=${AWX_PORT:-8443}
      - AWX_USERNAME=${AWX_USERNAME:-<username>}
      - AWX_PASSWORD=${AWX_PASSWORD:-<password>}
      - AWX_VAULT_ID=${AWX_VAULT_ID:-3}
      - AWX_OMD_SSH_KEY_CRED_ID=${AWX_OMD_SSH_KEY_CRED_ID:-4}
      - AWX_ITOPS_SSH_KEY_CRED_ID=${AWX_ITOPS_SSH_KEY_CRED_ID:-5}
      - ENDPOINTS_BASE_URL=${ENDPOINTS_BASE_URL:-http://localhost:61008}
      - SEED_ADMIN_USER=${SEED_ADMIN_USER:-test}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-Bogdan123!}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - gpta-data:/data

volumes:
  gpta-data:
