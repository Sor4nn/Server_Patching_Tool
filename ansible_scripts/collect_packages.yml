- name: Collect installed RPM packages from destination server
  hosts: "{{ host_group }}"
  gather_facts: false
  strategy: free
  tasks:
    - name: Collect installed RPM list as JSON
      command: >-
        python3 -c "import subprocess, json; out = subprocess.check_output(['rpm', '-qa', '--queryformat', '%{NAME}|%{VERSION}|%{RELEASE}|%{ARCH}|%{INSTALLTIME}\\n']).decode(); pkgs = [{'name': p[0], 'version': p[1], 'release': p[2], 'arch': p[3], 'installed_at': p[4] if len(p)>4 else ''} for line in out.strip().splitlines() for p in [line.split('|')] if len(p)>=4]; print(json.dumps(pkgs))"
      become: no
      register: rpms_json
      ignore_errors: yes

    - name: Set package list
      set_fact:
        package_list: "{{ rpms_json.stdout | from_json }}"
      when: rpms_json is succeeded and rpms_json.stdout is defined and rpms_json.stdout | length > 0

    - name: Update installed packages to DB
      environment:
        no_proxy: localhost,127.0.0.1
      uri:
        url: "{{ server_endpoints_app | default('http://localhost:61008') }}/updatepackages"
        method: POST
        body: {
                "hostname": "{{ inventory_hostname }}",
                "packages": "{{ package_list }}"
                }
        body_format: json
        return_content: yes
      delegate_to: 127.0.0.1
      when: package_list is defined and package_list | length > 0

