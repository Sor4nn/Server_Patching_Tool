- name: Check available RPM updates against destination server
  hosts: "{{ host_group }}"
  gather_facts: false
  strategy: free
  tasks:
    - name: Collect installed and available RPM packages with update status
      command: >-
        python3 -c "import subprocess,json;R=lambda c:(subprocess.check_output(c,stderr=subprocess.DEVNULL).decode().strip().splitlines() if subprocess.run(c,stdout=subprocess.DEVNULL).returncode==0 else []);inst=[{'name':p[0],'version':p[1],'release':p[2],'arch':p[3],'installed_at':p[4] if len(p)>4 else ''} for line in R(['rpm','-qa','--queryformat','%{NAME}|%{VERSION}|%{RELEASE}|%{ARCH}|%{INSTALLTIME}\n']) for p in [line.split('|')] if len(p)>=4];um={};[um.update({'.'.join(l.split()[0].split('.')[:-1]) if '.' in l.split()[0] else l.split()[0]: l.split()[1]}) for l in R(['dnf','check-update','--quiet','--security=false']) if len(l.split())>=2];ss=set('.'.join(l.split()[0].split('.')[:-1]) if '.' in l.split()[0] else l.split()[0] for l in R(['dnf','check-update','--quiet','--security']) if l.split());[p.update({'available_version':um.get(p['name'],''),'needs_update':p['name'] in um,'is_security_update':p['name'] in ss}) for p in inst];print(json.dumps(inst))"
      become: no
      register: pkgs_json
      ignore_errors: yes

    - name: Set decorated package list
      set_fact:
        decorated: "{{ pkgs_json.stdout | from_json }}"
      when: pkgs_json is succeeded and pkgs_json.stdout is defined and pkgs_json.stdout | length > 0

    - name: Update installed packages to DB
      environment:
        no_proxy: localhost,127.0.0.1
      uri:
        url: "{{ server_endpoints_app | default('http://localhost:61008') }}/updatepackages"
        method: POST
        body: {
                "hostname": "{{ inventory_hostname }}",
                "packages": "{{ decorated }}"
                }
        body_format: json
        return_content: yes
      delegate_to: 127.0.0.1
      when: decorated is defined and decorated | length > 0
