- name: Check available RPM updates against destination server
  hosts: "{{ host_group }}"
  gather_facts: false
  strategy: free
  tasks:
    - name: Collect installed and available RPM packages with update status
      command: >-
        python3 -c "import subprocess, json
        def run(cmd):
            try: return subprocess.check_output(cmd, stderr=subprocess.DEVNULL).decode().strip().splitlines()
            except Exception: return []
        installed = []
        for line in run(['rpm', '-qa', '--queryformat', '%{NAME}|%{VERSION}|%{RELEASE}|%{ARCH}|%{INSTALLTIME}\\n']):
            p = line.split('|')
            if len(p) >= 4:
                installed.append({'name': p[0], 'version': p[1], 'release': p[2], 'arch': p[3], 'installed_at': p[4] if len(p)>4 else ''})
        updates_map = {}
        for line in run(['dnf', 'check-update', '--quiet', '--security=false']):
            parts = line.split()
            if len(parts) >= 2:
                name = '.'.join(parts[0].split('.')[:-1]) if '.' in parts[0] else parts[0]
                updates_map[name] = parts[1]
        sec_set = set()
        for line in run(['dnf', 'check-update', '--quiet', '--security']):
            parts = line.split()
            if len(parts) >= 1:
                name = '.'.join(parts[0].split('.')[:-1]) if '.' in parts[0] else parts[0]
                sec_set.add(name)
        for pkg in installed:
            name = pkg['name']
            pkg['available_version'] = updates_map.get(name, '')
            pkg['needs_update'] = name in updates_map
            pkg['is_security_update'] = name in sec_set
        print(json.dumps(installed))"
      become: yes
      register: pkgs_json
      ignore_errors: yes

    - name: Set decorated package list
      set_fact:
        decorated: "{{ pkgs_json.stdout | from_json }}"
      when: pkgs_json is succeeded and pkgs_json.stdout is defined and pkgs_json.stdout | length > 0

    - name: Update installed packages to DB
      environment:
        no_proxy: localhost,127.0.0.1
      uri:
        url: "{{ server_endpoints_app | default('http://localhost:61008') }}/updatepackages"
        method: POST
        body: {
                "hostname": "{{ inventory_hostname }}",
                "packages": "{{ decorated }}"
                }
        body_format: json
        return_content: yes
      delegate_to: 127.0.0.1
      when: decorated is defined and decorated | length > 0