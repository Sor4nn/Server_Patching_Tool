- name: Collect critical systemd service status and filesystem usage
  hosts: "{{ host_group }}"
  gather_facts: false
  strategy: free
  vars:
    critical_services: []
  tasks:
    - name: Query systemd service status for critical services
      command: >-
        python3 -c "import subprocess,json;svcs={{ critical_services | to_json }};out=[];[out.append({'service_name':s,'load_state':(subprocess.check_output(['systemctl','show',s,'-p','LoadState,ActiveState,SubState','--value'],stderr=subprocess.DEVNULL,text=True).strip().splitlines()+['','',''])[:3][0],'active_state':(subprocess.check_output(['systemctl','show',s,'-p','LoadState,ActiveState,SubState','--value'],stderr=subprocess.DEVNULL,text=True).strip().splitlines()+['','',''])[:3][1],'sub_state':(subprocess.check_output(['systemctl','show',s,'-p','LoadState,ActiveState,SubState','--value'],stderr=subprocess.DEVNULL,text=True).strip().splitlines()+['','',''])[:3][2]}) if subprocess.run(['systemctl','show',s],stdout=subprocess.DEVNULL).returncode==0 else out.append({'service_name':s,'load_state':'error','active_state':'unknown','sub_state':'unknown'}) for s in svcs];print(json.dumps(out))"
      become: no
      register: services_json
      ignore_errors: yes

    - name: Collect filesystem usage (df)
      command: >-
        python3 -c "import subprocess,json;out=[];lines=(subprocess.check_output(['df','-P','-k'],stderr=subprocess.DEVNULL,text=True).splitlines()[1:] if subprocess.run(['df','-P','-k'],stdout=subprocess.DEVNULL).returncode==0 else []);[out.append({'mount':p[5],'device':p[0],'fs_type':'','size_kb':int(p[1]),'used_kb':int(p[2]),'avail_kb':int(p[3]),'use_pct':int(p[4].rstrip('%')) if p[4].rstrip('%').isdigit() else 0}) for line in lines for p in [line.split()] if len(p)>=6];print(json.dumps(out))"
      become: no
      register: fs_json
      ignore_errors: yes

    - name: Set service list
      set_fact:
        services_list: "{{ services_json.stdout | from_json }}"
      when: services_json is succeeded and services_json.stdout is defined and services_json.stdout | length > 0

    - name: Set filesystem list
      set_fact:
        fs_list: "{{ fs_json.stdout | from_json }}"
      when: fs_json is succeeded and fs_json.stdout is defined and fs_json.stdout | length > 0

    - name: Report services and filesystems to GPTA
      environment:
        no_proxy: localhost,127.0.0.1
      uri:
        url: "{{ server_endpoints_app | default('http://localhost:61008') }}/updateservices"
        method: POST
        body: {
                "hostname": "{{ inventory_hostname }}",
                "services": "{{ services_list | default([]) }}",
                "filesystems": "{{ fs_list | default([]) }}",
                "critical_names": "{{ critical_services }}"
                }
        body_format: json
        return_content: yes
      delegate_to: 127.0.0.1
      when: services_list is defined or fs_list is defined
